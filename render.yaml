# One-click deploy: https://render.com/deploy?repo=https://github.com/eaglepython/DearMe
services:
  - type: web
    name: dear-me-analytics
    runtime: docker
    plan: starter            # a persistent disk needs a paid plan; free instances lose data on every deploy
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true  # find it under Environment in the Render dashboard, or replace it with your own
      - key: DATA_DIR
        value: /data
    disk:
      name: analytics-data
      mountPath: /data
      sizeGB: 1
